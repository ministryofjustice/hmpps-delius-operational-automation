---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-script'
data:
  entrypoint.sh: |-
    #!/bin/bash
    set -euo pipefail
 
    echo "${SRC_DB_HOST}:5432:${SRC_DB_NAME}:${SRC_DB_USER}:${SRC_DB_PASS}" > ~/.pgpass
    echo "${DST_DB_HOST}:5432:${DST_DB_NAME}:${DST_DB_USER}:${DST_DB_PASS}" >> ~/.pgpass

    chmod 0600 ~/.pgpass
    chown job:job ~/.pgpass

    # Dump the source database
    pg_dump --jobs=4 --host="$SRC_DB_HOST" --username="$SRC_DB_USER" --dbname="$SRC_DB_NAME" --no-owner --no-privileges --verbose --format=directory --file=/home/job/db-dump 2>&1 | tee -a ~/error.log

    psql --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" -c "drop schema if exists public cascade;" 2>&1 | tee -a ~/error.log

    psql --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" -c "create schema public;" 2>&1 | tee -a ~/error.log

    # Restore the source database dump to the destination database
    pg_restore --jobs=4 --host="$DST_DB_HOST" --username="$DST_DB_USER" --dbname="$DST_DB_NAME" --no-owner --no-privileges --verbose /home/job/db-dump 2>&1 | tee -a ~/error.log
    rm -rv /home/job/db-dump ~/.pgpass

---
apiVersion: batch/v1
kind: Job
metadata:
  name: refresh-db
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: '{{ .Values.component }}-refresh-db'
          image: ghcr.io/ministryofjustice/hmpps-delius-alfresco-db-utils:latest
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 4
              memory: 2Gi
          command:
            - /bin/entrypoint.sh
          env:
            - name: SRC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_NAME
            - name: SRC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_USERNAME
            - name: SRC_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_PASSWORD
            - name: SRC_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.component }}-rds-instance-output'
                  key: RDS_INSTANCE_ADDRESS
            - name: DST_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.destinationEnvironment }}-{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_NAME
            - name: DST_DB_USER
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.destinationEnvironment }}-{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_USERNAME
            - name: DST_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.destinationEnvironment }}-{{ .Values.component }}-rds-instance-output'
                  key: DATABASE_PASSWORD
            - name: DST_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: '{{ .Values.destinationEnvironment }}-{{ .Values.component }}-rds-instance-output'
                  key: RDS_INSTANCE_ADDRESS
          volumeMounts:
            - name: refresh-db-script
              mountPath: /bin/entrypoint.sh
              readOnly: true
              subPath: entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      serviceAccount: cd-serviceaccount
      serviceAccountName: cd-serviceaccount
      restartPolicy: Never
      volumes:
        - name: refresh-db-script
          configMap:
            name: '{{ .Release.Name }}-script'
            defaultMode: 0755
  backoffLimit: 0
