name: "Oracle: Validate Backup"
run-name: "Oracle: ${{ github.event_name == 'workflow_dispatch' && format('{0}_{1}', github.event.inputs.TargetEnvironment, github.event.inputs.TargetHost) }}_validate_backup"
on:
  workflow_dispatch:
    inputs:
      TargetEnvironment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - "delius-core-dev"
          - "delius-core-test"
          - "delius-core-training"
          - "delius-core-stage"
          - "delius-core-preprod"
          - "delius-core-prod"
          - "delius-mis-dev"
          - "delius-mis-stage"
          - "delius-mis-preprod"
          - "delius-mis-prod"
      TargetHost:
        description: "Validate backup target host"
        required: true
        type: choice
        options: 
          - "delius_primarydb"
          - "mis_primarydb"
          - "boe_primarydb"
          - "dsd_primarydb"
          - "delius_standbydb1"
          - "mis_standbydb1"
          - "boe_standbydb1"
          - "dsd_standbydb1"
          - "delius_standbydb2"
          - "Random Delius Standby"
      RestoreDatetime:
        description: "Validate backup until restore datetime [DD-MM-YYYY HH24:MI:SS]"
        type: string
        default: ""
      VerboseOutput: 
        description: "Verbose Output level"
        type: choice
        options:
          - ""
          - "-v"
          - "-vv"
          - "-vvv"
          - "-vvvv"
      SourceCodeVersion:
        description: "Source version for the hmpps-delius-operation-automation. Enter a pull request, branch, commit ID, tag, or reference."
        type: string
        default: "main"
      SourceConfigVersion:
        description: "Source version for the modernisation-platform-configuration-management. Enter a pull request, branch, commit ID, tag, or reference."
        type: string
        default: "main"

  workflow_call:
    inputs:
      TargetEnvironment:
        description: "Target environment"
        required: true
        type: string
      TargetHost:
        description: "Validate backup target host"
        required: true
        type: string

  repository_dispatch:
    types: ["oracle-db-backup-validation-success","oracle-db-backup-validation-failure"]

env:
  ansible_config: operations/playbooks/ansible.cfg
  command: ansible-playbook operations/playbooks/oracle_backup/validate_backup.yml -e ansible_aws_ssm_bucket_name=${{ vars.ANSIBLE_AWS_SSM_BUCKET_NAME }}
  inventory: inventory/ansible

# Allow permissions on repository and docker image respectively 
permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build_rman_target_name:
    if: ${{ github.event_name != 'repository_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      RmanTarget: ${{ steps.preparermantargetname.outputs.RmanTarget }}
      TargetEnvironment: ${{ steps.preparermantargetname.outputs.TargetEnvironment }}-preapproved
      SlackChannel: ${{ steps.prepare-slack-channel-name.outputs.SlackChannel }}
    continue-on-error: false
    steps:

      - name: Prepare Slack Channel Name
        id: prepare-slack-channel-name
        run: |
             if [[ "${{ github.event.inputs.TargetEnvironment }}" == "delius-core-prod" || "${{ inputs.TargetEnvironment }}" == "delius-core-prod" ]]; then
                echo "SlackChannel=delius-aws-oracle-prod-alerts" >> $GITHUB_OUTPUT
             else
                echo "SlackChannel=delius-aws-oracle-dev-alerts" >> $GITHUB_OUTPUT
             fi

      - name: Check Restore DateTime Input
        if: ${{ (github.event_name == 'workflow_dispatch') && (github.event.inputs.RestoreDatetime != '') }}
        run: |
          isDateInvalid()
          {
              DATE="${1}"

              # Time format hour[01..23]:min[01..59]:sec[01..59]
              TIMEFORMAT="(([012][0]|[01][1-9]|[2][1-3]):([012345][0-9]):([012345][0-9]))"

              # Date format day[01..31], month[01,03,05,07,08,10,12], year[1900..2099]
              DATE_1="((([123][0]|[012][1-9])|3[1])-(0[13578]|1[02])-(19|20)[0-9][0-9])"

              # Date format day[01..30], month[04,06,09,11], year[1900..2099]
              DATE_2="(([123][0]|[012][1-9])-(0[469]|11)-(19|20)[0-9][0-9])"

              # Date format day[01..28], month[02], year[1900..2099]
              DATE_3="(([12][0]|[01][1-9]|2[1-8])-02-(19|20)[0-9][0-9])"

              # Date format day[29], month[02], year[1904..2096]
              DATE_4="(29-02-(19|20(0[48]|[2468][048]|[13579][26])))"

              # Match the date in the Regex
              if [[ "${DATE}" =~ ^((${DATE_1}|${DATE_2}|${DATE_3}|${DATE_4}) ${TIMEFORMAT})$ ]]
              then
                  echo "Restore Datetime ${DATE} valid"
              else
                  echo "Restore Datetime ${DATE} invalid!"
                  exit 1
              fi
          }
          isDateInvalid '${{ github.event.inputs.RestoreDatetime }}'

      - name: Checkout Helper Script
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            common/files/build_inventory_name.sh
          path: operations
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.SourceCodeVersion || 'main' }}
          fetch-depth: 0

      - name: Prepare Rman Target Name
        id: preparermantargetname
        run: |
          source "$PWD/operations/common/files/build_inventory_name.sh"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]
          then
            TargetHost="${{ github.event.inputs.TargetHost }}"
            TargetEnvironment="${{ github.event.inputs.TargetEnvironment }}"
          else
            TargetHost="${{ inputs.TargetHost }}"
            TargetEnvironment="${{ inputs.TargetEnvironment }}"
          fi;
          RmanTarget="$(build_inventory_name "$TargetEnvironment" "_$TargetHost")"
          echo "RmanTarget=$RmanTarget" >> $GITHUB_OUTPUT
          echo "TargetEnvironment=$TargetEnvironment" >> $GITHUB_OUTPUT
          
  deployment:
    if: ${{ github.event_name != 'repository_dispatch' }}
    name: oracle-validate-backup
    needs: build_rman_target_name
    environment: ${{ needs.build_rman_target_name.outputs.TargetEnvironment}}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ministryofjustice/hmpps-delius-operational-automation:0.80.0
    timeout-minutes: 1440
    env:
      RmanTarget: ${{ needs.build_rman_target_name.outputs.RmanTarget }}
      SlackChannel: ${{ needs.build_rman_target_name.outputs.SlackChannel }}
      TargetEnvironment: ${{ needs.build_rman_target_name.outputs.TargetEnvironment }}
    continue-on-error: false
    steps:

      - name: Checkout hmpps-delius-operation-automation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            playbooks/oracle_backup
            playbooks/ansible.cfg
            common/files/build_inventory_name.sh
            common/files/github_dispatch.sh
          path: operations
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.SourceCodeVersion || 'main' }}
          fetch-depth: 0

      - name: Checkout Ansible Inventory From modernisation-platform-configuration-management
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ministryofjustice/modernisation-platform-configuration-management
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ansible/hosts
            ansible/group_vars
          path: inventory
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.SourceConfigVersion || 'main' }}
          fetch-depth: 0

      - name: Checkout Ansible Required Roles From modernisation-platform-configuration-management
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ministryofjustice/modernisation-platform-configuration-management
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ansible/roles/secretsmanager-passwords
            ansible/roles/get-modernisation-platform-facts
          path: roles
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.SourceConfigVersion || 'main' }}
          fetch-depth: 0

      - name: Configure AWS Credentials
        id: login-aws
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: "arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/modernisation-platform-oidc-cicd"
          role-session-name: "hmpps-delius-operational-automation-${{ github.run_number }}"
          role-duration-seconds: 21600
          aws-region: "eu-west-2"

      - name: Randomize TargetHost If Specified
        if: ${{ contains( env.RmanTarget,'Random') }}
        working-directory: ${{ env.inventory }}
        id: randomizetargethost
        shell: bash
        run: |
          databasetype=$(echo ${RmanTarget} | sed 's/^.*_Random\(.*\)Standby$/\1/' | tr '[:upper:]' '[:lower:]')
          echo "Database Type : ${databasetype}"
          prefix=$(echo ${RmanTarget} | sed 's/^\(.*\)_Random\(.*\)Standby$/\1/' |  tr '[:upper:]' '[:lower:]')
          echo "Prefix        : ${prefix}"
          high_availability_count=$(yq .high_availability_count.${databasetype} group_vars/${prefix}_all.yml)
          echo "HA Count      : ${high_availability_count}"
          if [[ ${high_availability_count} -gt 0 ]]; then
              RmanTarget="${prefix}_${databasetype}_standbydb$(($RANDOM % ${high_availability_count} + 1 ))"
          fi
          echo "RMAN Target   : ${RmanTarget}"
          echo "RmanTarget=$RmanTarget" >> $GITHUB_OUTPUT

      - name: Start Ansible Validate Backup
        id: validate-backup
        shell: bash
        run: |
          [[ ! -z "${{ steps.randomizetargethost.outputs.RmanTarget }}" ]] && RmanTarget="${{ steps.randomizetargethost.outputs.RmanTarget }}"
          TargetEnvironment="${{ needs.build_rman_target_name.outputs.TargetEnvironment }}"
          # For readability we don't include the -preapproved suffix when reporting the environment
          TargetEnvironment="${TargetEnvironment%-preapproved}"
          export ANSIBLE_CONFIG=$ansible_config
          ln -s $PWD/roles/ansible/roles $PWD/operations/playbooks/oracle_backup/roles
          $command -i $inventory -e ansible_aws_ssm_bucket_name=${{ vars.ANSIBLE_AWS_SSM_BUCKET_NAME }} \
             -e rman_target=$RmanTarget \
             -e target_environment="${TargetEnvironment}" \
             -e source_code_version=${{ github.event.inputs.SourceCodeVersion || 'main' }} \
             -e source_config_version=${{ github.event.inputs.SourceConfigVersion || 'main' }} \
             -e github_repository="${{ github.repository }}" \
             $VerboseOutput

      - name: Checkout Local Repo to get Composite Action
        if: always()
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Send Slack Failure Notification
        id: foreground_slack_notification
        if: failure()
        uses: ./.github/actions/send-slack-notification
        env:
            AWS_ACCOUNT_ID: "${{ vars.AWS_ACCOUNT_ID }}"
        with:
          Emoji: ":github-red:"
          TextHeader: "Failed Backup Validation"
          TextBody: ":no_entry: Failed Backup Validation"
          TargetHost: "${{ env.RmanTarget }}"
          TargetEnvironment: "${{ needs.build_rman_target_name.outputs.TargetEnvironment }}"
          JobName: "${{ github.job }}"
          SourceCodeVersion: ${{ github.event.inputs.SourceCodeVersion || 'main' }}
          SourceConfigVersion: ${{ github.event.inputs.SourceConfigVersion || 'main' }}

  repository_dispatch_notification:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.sender.type == 'Bot' && (github.actor == 'hmpps-bot[bot]' || github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ministryofjustice/hmpps-delius-operational-automation:0.80.0
    environment: "${{ (contains(fromJson('[\"delius-core-dev\",\"delius-core-test\",\"delius-core-training\",\"delius-core-stage\",\"delius-core-preprod\",\"delius-core-prod\",\"delius-mis-dev\",\"delius-mis-stage\",\"delius-mis-preprod\",\"delius-mis-prod\"]'), github.event.client_payload.TargetEnvironment || github.event.client_payload.targetEnvironment || github.event.client_payload.target_environment) && format('{0}-preapproved', github.event.client_payload.TargetEnvironment || github.event.client_payload.targetEnvironment || github.event.client_payload.target_environment)) || 'hmpps-oem-development-preapproved' }}"
    concurrency:
      group: repository-dispatch-${{ github.event.action }}-${{ github.event.client_payload.TargetEnvironment || github.event.client_payload.targetEnvironment || github.event.client_payload.target_environment || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    outputs:
      TargetEnvironment: ${{ steps.prepare-repository-dispatch-inputs.outputs.TargetEnvironment }}
      TargetHost: ${{ steps.prepare-repository-dispatch-inputs.outputs.TargetHost }}
      SourceCodeVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceCodeVersion }}
      SourceConfigVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceConfigVersion }}
    steps:
      - name: Checkout Local Repo to get Composite Action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Repository Dispatch Source Metadata
        shell: bash
        env:
          DISPATCH_ACTION: ${{ github.event.action }}
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_SENDER: ${{ github.event.sender.login }}
          DISPATCH_SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          if [[ ! "$DISPATCH_ACTION" =~ ^oracle-db-backup-validation-(success|failure)$ ]]; then
            echo "Invalid repository_dispatch action: $DISPATCH_ACTION" >&2
            exit 1
          fi

          if [[ "$DISPATCH_SENDER_TYPE" != "Bot" ]]; then
            echo "Invalid repository_dispatch sender type: $DISPATCH_SENDER_TYPE" >&2
            exit 1
          fi

          if [[ "$DISPATCH_SENDER" != "$DISPATCH_ACTOR" ]]; then
            echo "Sender/actor mismatch: sender=$DISPATCH_SENDER actor=$DISPATCH_ACTOR" >&2
            exit 1
          fi

          if [[ "$DISPATCH_SENDER" != "hmpps-bot[bot]" && "$DISPATCH_SENDER" != "github-actions[bot]" ]]; then
            echo "Unauthorized repository_dispatch sender: $DISPATCH_SENDER" >&2
            exit 1
          fi

      - name: Prepare Repository Dispatch Inputs
        id: prepare-repository-dispatch-inputs
        shell: bash
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail

          payload_file="$(mktemp)"
          trap 'rm -f "$payload_file"' EXIT
          printf '%s' "$CLIENT_PAYLOAD" > "$payload_file"

          read_payload_value() {
            jq -er "$1 // empty | tostring" "$payload_file" 2>/dev/null || true
          }

          # Ensure all values are a single line before writing to GitHub output.
          trim_to_single_line() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          target_environment="$(trim_to_single_line "$(read_payload_value '.TargetEnvironment // .targetEnvironment // .target_environment')")"
          target_host="$(trim_to_single_line "$(read_payload_value '.TargetHost // .targetHost // .target_host')")"
          source_code_version="$(trim_to_single_line "$(read_payload_value '.SourceCodeVersion // .sourceCodeVersion // .source_code_version')")"
          source_config_version="$(trim_to_single_line "$(read_payload_value '.SourceConfigVersion // .sourceConfigVersion // .source_config_version')")"
          dispatch_source="$(trim_to_single_line "$(read_payload_value '.DispatchSource // .dispatchSource // .dispatch_source')")"

          # Reject untrusted values that contain characters outside expected formats.
          [[ "$target_environment" =~ ^[a-z0-9-]+$ ]] || target_environment="unknown"
          [[ "$target_host" =~ ^[A-Za-z0-9._-]+$ ]] || target_host="unknown"
          [[ "$source_code_version" =~ ^[A-Za-z0-9._/-]+$ ]] || source_code_version="main"
          [[ "$source_config_version" =~ ^[A-Za-z0-9._/-]+$ ]] || source_config_version="main"
          [[ "$dispatch_source" == "oracle-backup-validation" ]] || {
            echo "Invalid repository_dispatch source marker" >&2
            exit 1
          }

          [[ -n "$target_environment" ]] || target_environment="unknown"
          [[ -n "$target_host" ]] || target_host="unknown"
          [[ -n "$source_code_version" ]] || source_code_version="main"
          [[ -n "$source_config_version" ]] || source_config_version="main"

          printf 'TargetEnvironment=%s\n' "$target_environment" >> "$GITHUB_OUTPUT"
          printf 'TargetHost=%s\n' "$target_host" >> "$GITHUB_OUTPUT"
          printf 'SourceCodeVersion=%s\n' "$source_code_version" >> "$GITHUB_OUTPUT"
          printf 'SourceConfigVersion=%s\n' "$source_config_version" >> "$GITHUB_OUTPUT"

      - name: Validate Repository Dispatch Payload
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ steps.prepare-repository-dispatch-inputs.outputs.TargetEnvironment }}
          TARGET_HOST: ${{ steps.prepare-repository-dispatch-inputs.outputs.TargetHost }}
        run: |
          if [[ ! "$TARGET_ENVIRONMENT" =~ ^(delius-core-dev|delius-core-test|delius-core-training|delius-core-stage|delius-core-preprod|delius-core-prod|delius-mis-dev|delius-mis-stage|delius-mis-preprod|delius-mis-prod)$ ]]; then
            echo "Invalid repository_dispatch TargetEnvironment: $TARGET_ENVIRONMENT" >&2
            exit 1
          fi

          if [[ ! "$TARGET_HOST" =~ ((delius|mis|boe|dsd)_(primarydb|standbydb[1-2]))$ ]]; then
            echo "Invalid repository_dispatch TargetHost: $TARGET_HOST" >&2
            exit 1
          fi

      - name: Send Slack Repository Dispatch Success Notification
        if: ${{ github.event.action == 'oracle-db-backup-validation-success' }}
        id: repository_dispatch_success_slack_notification
        uses: ./.github/actions/send-slack-notification
        env:
          AWS_ACCOUNT_ID: "${{ vars.AWS_ACCOUNT_ID }}"
        with:
          Emoji: ":github-green:"
          TextHeader: "Backup Validation Success"
          TextBody: ":github-tick: Backup validation completed successfully"
          TargetHost: "${{ steps.prepare-repository-dispatch-inputs.outputs.TargetHost }}"
          TargetEnvironment: "${{ steps.prepare-repository-dispatch-inputs.outputs.TargetEnvironment }}"
          JobName: "${{ github.event.action }}"
          SourceCodeVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceCodeVersion }}
          SourceConfigVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceConfigVersion }}

      - name: Send Slack Repository Dispatch Failure Notification
        if: ${{ github.event.action == 'oracle-db-backup-validation-failure' }}
        id: repository_dispatch_failure_slack_notification
        uses: ./.github/actions/send-slack-notification
        env:
          AWS_ACCOUNT_ID: "${{ vars.AWS_ACCOUNT_ID }}"
        with:
          Emoji: ":github-red:"
          TextHeader: "Backup Validation Failure"
          TextBody: ":cross-red: Backup validation failed"
          TargetHost: "${{ steps.prepare-repository-dispatch-inputs.outputs.TargetHost }}"
          TargetEnvironment: "${{ steps.prepare-repository-dispatch-inputs.outputs.TargetEnvironment }}"
          JobName: "${{ github.event.action }}"
          SourceCodeVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceCodeVersion }}
          SourceConfigVersion: ${{ steps.prepare-repository-dispatch-inputs.outputs.SourceConfigVersion }}